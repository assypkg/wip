<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f6f4">
<title>Assembly Workspace — Internal UI Preview</title>
<style>
:root{--canvas:#f3f5f3;--paper:#fff;--ink:#34495e;--muted:#81908a;--line:#e3e9e5;--sage:#6f9386;--sage-bg:#eaf1ed;--blue:#6e8795;--blue-bg:#edf2f4;--sand:#a28a69;--sand-bg:#f4f0e9;--purple:#89789d;--purple-bg:#f0edf4;--red:#b96d6d;--shadow:0 4px 18px rgba(42,60,51,.045)}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.shell{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:252px;background:#fff;border-right:1px solid var(--line);padding:23px 16px;display:flex;flex-direction:column;z-index:5;transition:width .2s,transform .2s;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:3px 8px 25px}.brand-mark{width:38px;height:38px;border-radius:10px;background:#e8efeb;color:#577967;display:grid;place-items:center;font-weight:850;letter-spacing:-1px}.brand strong{display:block;font-size:13px;letter-spacing:.1em}.brand small{display:block;color:var(--muted);font-size:11px}
.nav-label{padding:8px 10px;color:#a0aaa4;font-size:10px;font-weight:800;letter-spacing:.13em}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#718078;text-align:left;padding:10px 12px;border-radius:9px;font:600 13px/1.4 Inter,system-ui,sans-serif;display:flex;align-items:center;gap:12px;cursor:pointer}.nav button:hover{background:#f6f8f6}.nav button.active{background:var(--sage-bg);color:#557966}.nav-icon{width:19px;text-align:center;font-size:16px}
.master-group{margin-top:13px}.master-trigger{width:100%;border:0;background:transparent;color:#718078;text-align:left;padding:10px 12px;border-radius:9px;font:650 13px/1.4 Inter,system-ui,sans-serif;display:flex;align-items:center;gap:12px}.master-trigger:hover,.master-open .master-trigger{background:#f6f8f6;color:#557966}.master-count{margin-left:auto;border:1px solid var(--line);border-radius:20px;padding:1px 7px;font-size:10px;color:#849189;background:#fafcfb}.master-chevron{font-size:15px;color:#94a199;transition:transform .18s}.master-open .master-chevron{transform:rotate(180deg)}.master-submenu{display:none;gap:3px;padding:4px 0 4px 30px}.master-open .master-submenu{display:grid}.master-submenu button{width:100%;border:0;background:transparent;color:#7d8982;text-align:left;padding:8px 10px;border-radius:7px;font:500 12px/1.35 Inter,system-ui,sans-serif}.master-submenu button:hover{background:#f6f8f6;color:#557966}.master-submenu button.active{background:var(--sage-bg);color:#557966;font-weight:700}.master-submenu button:before{content:"";width:5px;height:5px;border-radius:50%;background:#b8c6be;display:inline-block;margin:0 9px 1px 0}
.sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding:16px 9px 2px;color:#9aa49e;font-size:10px;letter-spacing:.04em}
.main{margin-left:252px;min-height:100vh;transition:margin .2s}.topbar{height:66px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:3;backdrop-filter:blur(12px)}.top-left{display:flex;align-items:center;gap:14px}.crumb{font-size:12px;color:#9aa49e}.crumb b{color:#607168;font-weight:650}.menu-toggle{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#66786f}.top-right{display:flex;align-items:center;gap:10px;color:#829088;font-size:11px}.avatar{width:30px;height:30px;border-radius:50%;background:#eaf1ed;color:#5e806e;display:grid;place-items:center;font-weight:700}
.content{max-width:1450px;margin:0 auto;padding:30px 34px 60px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.14em;color:#97a39c}.welcome{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:10px 0 25px}.welcome h1{font-size:28px;letter-spacing:-.04em;font-weight:650;margin:0;color:#34495e}.welcome p{margin:6px 0 0;color:#81908a;font-size:13px}.date-chip{padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#718078;font-size:10px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.section-title h2{font-size:13px;margin:0;font-weight:750;color:#52645a}.section-title span{font-size:11px;color:#9aa49e}
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.app-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:19px 18px 17px;min-height:180px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:flex-start;cursor:pointer;text-align:left;color:inherit;transition:transform .16s,border-color .16s,box-shadow .16s}.app-card:hover{transform:translateY(-2px);border-color:#cbd9d0;box-shadow:0 8px 22px rgba(42,60,51,.07)}.app-icon{width:39px;height:39px;border-radius:10px;display:grid;place-items:center;font-size:18px;margin-bottom:15px;flex:none}.app-icon.sage{background:var(--sage-bg);color:#5c806c}.app-icon.blue{background:var(--blue-bg);color:#66818f}.app-icon.sand{background:var(--sand-bg);color:#957e5d}.app-icon.purple{background:var(--purple-bg);color:#796a8d}.app-card h3{font-size:14px;margin:0 0 5px;font-weight:700}.app-card p{font-size:11px;color:#849189;line-height:1.55;margin:0}.app-action{margin-top:auto;padding-top:16px;color:#668373;font-size:10px;font-weight:800;letter-spacing:.08em}
.lower{display:grid;grid-template-columns:1.35fr 1fr;gap:15px;margin-top:22px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:var(--shadow);min-width:0}.panel h3,.card-title{font-size:12px;margin:0;color:#53645b;font-weight:750}.notice{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-top:1px solid #eff2ef}.notice:first-of-type{border-top:0}.notice-mark{width:28px;height:28px;border-radius:8px;background:#f0f4f1;color:#6e8b79;display:grid;place-items:center;flex:none}.notice b{display:block;font-size:11px;font-weight:650}.notice small{display:block;color:#929d96;font-size:10px;margin-top:3px}.plant-row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #eff2ef;font-size:11px;color:#78867e}.plant-row strong{color:#53685c;font-weight:650}
.page-heading{display:flex;align-items:center;gap:13px;margin:11px 0 20px}.page-heading .app-icon{margin:0}.page-heading h1{font-size:24px;margin:0;font-weight:680;letter-spacing:-.03em}.page-heading p{font-size:12px;color:#89958e;margin:4px 0 0}.heading-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.badge-soft{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border:1px solid var(--line);border-radius:20px;background:#fafcfb;color:#77877e;font-size:10px;font-weight:650}
.meta-bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:16px;box-shadow:var(--shadow)}.meta-bar.two{grid-template-columns:repeat(2,minmax(0,1fr))}.field{min-width:0}.field label,.field-label{display:block;font-size:10px;font-weight:750;color:#718078;margin:0 0 5px}.field input,.field select,.field textarea,.input-like{width:100%;min-width:0;border:1px solid #dfe6e1;border-radius:8px;background:#fff;padding:9px 10px;outline:none;font-size:12px;color:#485c51;min-height:38px}.field input:focus,.field select:focus,.field textarea:focus{border-color:#93b1a1;box-shadow:0 0 0 3px rgba(111,147,134,.11)}.field input::placeholder,.field textarea::placeholder{color:#b0bbb4}.field small{display:block;color:#98a39c;font-size:9px;margin-top:4px;line-height:1.4}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.span-2{grid-column:1/-1}
.work-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(340px,.92fr);gap:15px;align-items:start}.stack{display:grid;gap:14px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;margin-bottom:13px;border-bottom:1px solid #edf1ee}.card-head .sub{font-size:10px;color:#9aa49e;margin-top:3px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid #dce5df;background:#fff;color:#63776b;border-radius:8px;padding:8px 11px;font-size:10px;font-weight:750;white-space:nowrap}.btn:hover{background:#f7faf8}.btn.primary{background:#628b76;color:#fff;border-color:#628b76}.btn.primary:hover{background:#557e69}.btn.blue{background:#edf2f4;color:#627d8a;border-color:#dbe5e9}.btn.sand{background:#f4f0e9;color:#927c5e;border-color:#ebe2d5}.btn.red{background:#fff7f7;color:#a66b6b;border-color:#efdddd}.btn.ghost{background:#f8faf8}.subnav{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.subtab{border:1px solid #e0e7e2;border-radius:8px;background:#fff;color:#77867e;padding:7px 10px;font-size:10px;font-weight:750}.subtab.active{background:var(--sage-bg);border-color:#d4e3d9;color:#587a67}
.callout{padding:10px 12px;border:1px solid #e3ebe6;background:#f8fbf9;color:#718178;border-radius:9px;font-size:10px;line-height:1.5;margin:10px 0}.callout.blue{background:#f7fafb;border-color:#e1e9ed}.callout.sand{background:#fbf9f5;border-color:#eee7db}.callout.purple{background:#faf9fc;border-color:#e9e4ef}
.qty-panel{border:1px solid #e1e9e4;background:#f8faf8;border-radius:10px;padding:13px;margin-top:13px}.qty-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.qty-head b{font-size:11px;color:#5b7968}.qty-head span{font-size:10px;color:#91a098}.qty-total{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid #e8eeea;border-radius:8px;padding:9px 10px;margin-top:10px;font-size:10px;color:#89968e}.qty-total strong{font-size:12px;color:#62836f}.empty{padding:22px 13px;border:1px dashed #dce5df;border-radius:9px;text-align:center;color:#9aa59e;font-size:11px;background:#fbfcfb}.empty strong{display:block;color:#6d7f74;font-size:12px;margin-bottom:4px}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0}.stat{padding:12px;border:1px solid #e7ede9;border-radius:9px;background:#fbfcfb}.stat small{display:block;font-size:9px;color:#929f97}.stat strong{display:block;font-size:17px;letter-spacing:-.03em;color:#516b5c;margin-top:3px}.stat em{font-style:normal;color:#9aa59e;font-size:9px}
.list-table{width:100%;border-collapse:collapse;font-size:10px}.list-table th{text-align:left;color:#89968e;background:#f8faf8;font-weight:750;padding:9px 8px}.list-table td{padding:10px 8px;border-top:1px solid #edf1ee;color:#65766c}.list-table .muted{text-align:center;color:#a3ada6;padding:20px 8px}.wa-box{width:100%;min-height:120px;border:1px solid #dce8df;border-radius:9px;background:#f7faf8;padding:12px;color:#718178;font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
.two-qty{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mini-card{border:1px solid #e5ece7;border-radius:9px;padding:12px;background:#fff}.mini-card h4{font-size:10px;color:#607c69;margin:0 0 10px}.toggle-row{display:flex;align-items:flex-start;gap:9px;padding:11px;border:1px solid #e4ebe6;border-radius:9px;background:#fafcfa;font-size:10px;color:#66796d}.toggle-row input{accent-color:#6f9386;margin-top:2px}
.master-status{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#f8faf9;border:1px solid #e3ebe6;border-radius:9px;color:#75857b;font-size:10px;margin:12px 0}.status-dot{width:7px;height:7px;background:#b1c1b7;border-radius:50%;flex:none}.master-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;background:#fbfcfb;border:1px solid #e7ede9;border-radius:10px}.master-form .full{grid-column:1/-1}.master-results{margin-top:14px;border:1px solid #e7ede9;border-radius:10px;overflow:hidden}.master-results-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;background:#fafcfa;border-bottom:1px solid #e7ede9}.master-results-head b{font-size:11px;color:#607468}.master-results-head span{font-size:9px;color:#9aa59e}.result-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid #eef2ef;font-size:10px;color:#66776d}.result-row:first-child{border-top:0}.result-row small{display:block;color:#9aa59e;font-size:9px;margin-top:3px}.result-row strong{font-size:10px;color:#597361}.upload-box{padding:14px;border:1px dashed #cbd9d0;border-radius:10px;background:#fafcfa}.upload-box b{font-size:11px;display:block;color:#60776a;margin-bottom:4px}.upload-box p{font-size:10px;color:#89968e;line-height:1.5;margin:0 0 10px}.upload-box input{font-size:10px;max-width:100%}
.collapsed .sidebar{width:76px;padding-inline:12px}.collapsed .brand{padding-inline:6px}.collapsed .brand-copy,.collapsed .nav-label,.collapsed .nav-text,.collapsed .sidebar-foot{display:none}.collapsed .nav button,.collapsed .master-trigger{justify-content:center;padding:12px 5px}.collapsed .master-count,.collapsed .master-chevron,.collapsed .master-submenu{display:none!important}.collapsed .main{margin-left:76px}
@media(max-width:900px){.sidebar{width:252px;transform:translateX(-102%);box-shadow:10px 0 28px rgba(40,55,47,.1)}.mobile-open .sidebar{transform:translateX(0)}.main,.collapsed .main{margin-left:0}.collapsed .sidebar{width:252px}.content{padding:23px 17px 42px}.topbar{padding:0 16px}.apps{grid-template-columns:1fr}.app-card{min-height:140px}.lower,.work-grid{grid-template-columns:1fr}.work-grid{gap:12px}.welcome{align-items:flex-start;flex-direction:column}.date-chip{display:none}.meta-bar{grid-template-columns:1fr 1fr}.meta-bar .field:first-child{grid-column:1/-1}.form-grid.three{grid-template-columns:1fr 1fr}.heading-actions{margin-left:0;width:100%}.page-heading{flex-wrap:wrap}.page-heading>div:nth-child(2){flex:1}.two-qty{grid-template-columns:1fr}.master-form{grid-template-columns:1fr}.master-form .full{grid-column:auto}}
@media(max-width:520px){.content{padding:20px 13px 36px}.topbar{height:60px}.top-right>span:first-child{display:none}.page-heading h1{font-size:21px}.meta-bar,.meta-bar.two{grid-template-columns:1fr 1fr;padding:10px}.meta-bar .field:first-child{grid-column:auto}.form-grid,.form-grid.three{grid-template-columns:1fr}.span-2{grid-column:auto}.stat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{padding:9px}.stat strong{font-size:15px}.card,.panel{padding:13px}.list-table{font-size:9px}.subnav{gap:5px}.subtab{padding:7px 8px}.actions .btn{white-space:normal}.master-form{padding:11px}}
@media(min-width:901px) and (max-width:1180px){.apps{grid-template-columns:repeat(2,minmax(0,1fr))}.work-grid{grid-template-columns:1fr}.content{padding-left:25px;padding-right:25px}}
</style>
</head>
<body>
<div class="shell" id="shell">
<aside class="sidebar">
 <div class="brand"><div class="brand-mark">A</div><div class="brand-copy"><strong>ASSEMBLY</strong><small>Production Workspace</small></div></div>
 <div class="nav-label">WORKSPACE</div>
 <nav class="nav">
  <button class="active" data-page="home"><span class="nav-icon">⌂</span><span class="nav-text">Home</span></button>
  <button data-page="wip"><span class="nav-icon">▤</span><span class="nav-text">Aplikasi WIP</span></button>
  <button data-page="fg"><span class="nav-icon">▦</span><span class="nav-text">Finish Good</span></button>
  <button data-page="spa"><span class="nav-icon">▧</span><span class="nav-text">Laporan Awal Shift</span></button>
 </nav>
 <div class="nav-label">DATA MASTER</div>
 <div class="master-group" id="masterGroup">
  <button class="master-trigger" type="button" data-action="master-toggle" aria-expanded="false" aria-controls="masterSubmenu"><span class="nav-icon">▣</span><span class="nav-text">Master</span><span class="master-count">5</span><span class="master-chevron">⌄</span></button>
  <div class="master-submenu" id="masterSubmenu">
   <button type="button" data-page="masterFg">Master FG</button><button type="button" data-page="masterWip">Master WIP</button><button type="button" data-page="masterLeader">Master Leader</button><button type="button" data-page="masterJo">Master JO</button><button type="button" data-page="importErp">Import ERP</button>
  </div>
 </div>
 <div class="sidebar-foot">ASSEMBLY OPERATIONS<br>INTERNAL PRODUCTION SYSTEM</div>
</aside>
<main class="main">
 <header class="topbar"><div class="top-left"><button class="menu-toggle" id="toggle" aria-label="Toggle sidebar">☰</button><div class="crumb">Workspace&nbsp; / &nbsp;<b id="crumb">Home</b></div></div><div class="top-right"><span>Production Workspace</span><span class="avatar">A</span></div></header>
 <div class="content" id="content"></div>
</main>
</div>
<script>
const shell=document.getElementById('shell'),content=document.getElementById('content'),crumb=document.getElementById('crumb');
const pages={
 home:{title:'Home',icon:'⌂',tone:'sage',desc:'Pusat akses aplikasi dan aktivitas produksi Assembly.'},
 wip:{title:'Aplikasi WIP',icon:'▤',tone:'sage',desc:'Input, pemantauan, dan pengelolaan sisa barang bagus Assembly.'},
 fg:{title:'Finish Good',icon:'▦',tone:'blue',desc:'Input hasil produksi, kalkulasi, dan laporan Finish Good.'},
 spa:{title:'Laporan Awal Shift',icon:'▧',tone:'purple',desc:'Input ketersediaan komponen dan rekap laporan awal shift.'},
 masterFg:{title:'Master FG',icon:'▦',tone:'blue',desc:'Master produk Finish Good dan standar produksi.'},
 masterWip:{title:'Master WIP',icon:'▤',tone:'sage',desc:'Katalog produk, komponen, dan kode part WIP.'},
 masterLeader:{title:'Master Leader',icon:'◉',tone:'sage',desc:'Pengelolaan daftar nama leader untuk referensi input produksi.'},
 masterJo:{title:'Master JO',icon:'▤',tone:'sand',desc:'Pengelolaan nomor Job Order untuk referensi input produksi.'},
 importErp:{title:'Import ERP',icon:'⇧',tone:'blue',desc:'Import data Produk dan Job Order dari file ERP.'}
};
function field(label,placeholder,type,extra){return '<div class="field"><label>'+label+'</label><input type="'+(type||'text')+'" placeholder="'+(placeholder||'')+'" '+(extra||'')+'></div>'}
function selectField(label,options){return '<div class="field"><label>'+label+'</label><select>'+options.map(x=>'<option>'+x+'</option>').join('')+'</select></div>'}
function pageHead(key){const p=pages[key];return '<div class="eyebrow">ASSEMBLY / WORKSPACE / '+p.title.toUpperCase()+'</div><div class="page-heading"><span class="app-icon '+p.tone+'">'+p.icon+'</span><div><h1>'+p.title+'</h1><p>'+p.desc+'</p></div><div class="heading-actions"><span class="badge-soft">DESIGN PREVIEW</span></div></div>'}
function sectionNav(items){return '<div class="subnav">'+items.map((x,i)=>'<button class="subtab '+(i===0?'active':'')+'" data-scroll="'+x[1]+'">'+x[0]+'</button>').join('')+'</div>'}
function homePage(){return '<div class="eyebrow">ASSEMBLY / WORKSPACE</div><div class="welcome"><div><h1>Selamat datang</h1><p>Pusat akses aplikasi dan aktivitas produksi Assembly.</p></div><div class="date-chip">PRODUCTION WORKSPACE</div></div><div class="section-title"><h2>Aplikasi</h2><span>3 modul operasional</span></div><div class="apps"><button class="app-card" data-page="wip"><span class="app-icon sage">▤</span><h3>Aplikasi WIP</h3><p>Input, pemantauan, dan pengelolaan sisa barang bagus Assembly.</p><span class="app-action">BUKA APLIKASI →</span></button><button class="app-card" data-page="fg"><span class="app-icon blue">▦</span><h3>Finish Good</h3><p>Input hasil produksi, target, manpower, dan laporan Finish Good.</p><span class="app-action">BUKA APLIKASI →</span></button><button class="app-card" data-page="spa"><span class="app-icon purple">▧</span><h3>Laporan Awal Shift</h3><p>Pengelolaan laporan awal shift dan informasi kesiapan produksi.</p><span class="app-action">BUKA APLIKASI →</span></button></div><div class="lower"><section class="panel"><h3>Informasi Workspace</h3><div class="notice"><span class="notice-mark">i</span><div><b>Sistem Operasional Assembly</b><small>Akses terpusat untuk modul WIP, Finish Good, dan laporan awal shift.</small></div></div><div class="notice"><span class="notice-mark">⌁</span><div><b>Plant Alpha &amp; Plant Beta</b><small>Modul kerja mengikuti kebutuhan unit produksi yang berjalan.</small></div></div></section><section class="panel"><h3>Modul Workspace</h3><div class="plant-row"><span>01 · Aplikasi WIP</span><strong>WIP</strong></div><div class="plant-row"><span>02 · Finish Good</span><strong>FG</strong></div><div class="plant-row"><span>03 · Laporan Awal Shift</span><strong>SPA</strong></div><div class="plant-row"><span>04 · Data Master</span><strong>5 SUB-MENU</strong></div></section></div>'}

oran SPA</button><button class="btn red">Reset All SPA</button></div></section><div class="stack"><section class="card" id="spa-list"><div class="card-head"><div><div class="card-title">Rincian SPA</div><div class="sub">Stok Assy + Gudang dan pengelompokan komponen</div></div><button class="btn red">Reset SPA</button></div><div class="actions"><button class="btn">Import laporan WhatsApp SPA</button></div><div class="stat-grid"><div class="stat"><small>Komponen</small><strong>—</strong><em>Item</em></div><div class="stat"><small>Stok Assy</small><strong>—</strong><em>PCS</em></div><div class="stat"><small>Stok Gudang</small><strong>—</strong><em>PCS</em></div></div><div class="empty"><strong>Rincian SPA akan tampil di sini</strong>Belum ada data pada preview ini.</div></section><section class="card" id="spa-wa"><div class="card-head"><div><div class="card-title">Laporan WhatsApp SPA</div><div class="sub">Teks laporan dapat diedit sebelum dikirim</div></div></div><div class="actions"><button class="btn primary">Kirim WhatsApp</button><button class="btn">Salin Teks</button><button class="btn">Format Otomatis</button></div><textarea class="wa-box" placeholder="Laporan SPA akan tampil di sini..."></textarea></section></div></div>'}
function masterHeader(title,desc){return '<div class="card-head"><div><div class="card-title">'+title+'</div><div class="sub">'+desc+'</div></div><span class="badge-soft">MASTER DATA</span></div><div class="master-status"><span class="status-dot"></span>Status cloud / sinkronisasi ditampilkan di area ini saat terhubung ke aplikasi produksi.</div><div class="actions" style="margin-bottom:13px"><button class="btn">Sinkronkan</button><button class="btn">Unduh Backup Lokal</button></div>'}

function erpPage(){return pageHead('importErp')+'<section class="card"><div class="card-head"><div><div class="card-title">Import Data ERP — Produk & Job Order</div><div class="sub">Upload file jadwal ERP, validasi data, dan periksa pemetaan item code</div></div><span class="badge-soft">IMPORT</span></div><div class="master-status"><span class="status-dot"></span>Status relasi ERP di cloud ditampilkan setelah integrasi produksi dilakukan.</div><div class="actions" style="margin-bottom:13px"><button class="btn">Sinkronkan ERP</button><button class="btn">Unduh Backup ERP</button></div><div class="upload-box"><b>Upload file jadwal ERP (.HTM / .HTML)</b><p>File yang dibaca: Job Order, Item Code, dan Item Name. Unit Produksi, Confirm Date, dan Confirm Qty diabaikan. JO berulang pada tanggal berbeda digabung.</p><input type="file" accept=".htm,.html,text/html"></div><div class="upload-box" style="margin-top:13px"><b>Import Standar Hasil & Qty/Box ke Master FG</b><p>Upload file .ODS / .XLSX / .XLS. Kolom dibaca: Nama Produk, Kode Item, Isi per Box (PCS), dan Standar Hasil 8 Jam.</p><input type="file" accept=".ods,.xlsx,.xls"></div><div class="master-results"><div class="master-results-head"><b>Preview hasil import & pemetaan Item Code</b><span>Belum ada file diproses</span></div><div class="empty" style="margin:11px">Preview data akan muncul setelah file dipilih. Validasi dan simpan cloud tetap mengikuti aplikasi produksi.</div></div></section>'}
function renderScreen(key){if(key==='home')return homePage();if(key==='wip')return wipPage();if(key==='fg')return fgPage();if(key==='spa')return spaPage();if(key==='masterFg')return masterFgPage();if(key==='masterWip')return masterWipPage();if(key==='masterLeader')return masterLeaderPage();if(key==='masterJo')return masterJoPage();if(key==='importErp')return erpPage();return homePage()}
function showPage(key){const p=pages[key];if(!p)return;document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===key));const isMaster=key.startsWith('master')||key==='importErp';const group=document.getElementById('masterGroup');const trigger=document.querySelector('[data-action="master-toggle"]');group.classList.toggle('master-open',isMaster);trigger.setAttribute('aria-expanded',String(isMaster));trigger.classList.toggle('active',isMaster);crumb.textContent=p.title;content.innerHTML=renderScreen(key);location.hash=key;if(innerWidth<=900)shell.classList.remove('mobile-open');}
document.addEventListener('click',e=>{const master=e.target.closest('[data-action="master-toggle"]');if(master){if(innerWidth>900&&shell.classList.contains('collapsed'))shell.classList.remove('collapsed');const group=document.getElementById('masterGroup');const opened=group.classList.toggle('master-open');master.setAttribute('aria-expanded',String(opened));return;}const tab=e.target.closest('[data-scroll]');if(tab){document.querySelectorAll('.subtab').forEach(x=>x.classList.toggle('active',x===tab));const target=document.getElementById(tab.dataset.scroll);if(target)target.scrollIntoView({behavior:'smooth',block:'start'});return;}const target=e.target.closest('[data-page]');if(target)showPage(target.dataset.page);});
document.getElementById('toggle').addEventListener('click',()=>{if(innerWidth<=900)shell.classList.toggle('mobile-open');else shell.classList.toggle('collapsed');});
const initial=location.hash.slice(1);showPage(pages[initial]?initial:'home');
</script>
